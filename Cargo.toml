[package]
name = "drawnnetc"
version = "0.1.3"
edition = "2024"
publish = false

[dependencies]
# The engine; Skia comes with it, prebuilt for your platform, used as drawnui::skia.
drawnui = "1.2"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# Calls into the Java side (VPN service, clipboard) and back.
jni = "0.21"

[target.'cfg(windows)'.dependencies]
# Win32 for the tunnel helper (UAC start, events, job object), the clipboard and the locale.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization", "Win32_System_JobObjects"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
# No symbol names in the shipped library (the JNI entry points stay exported).
strip = true

# Its own workspace: the app builds the same inside or outside another one.
[workspace]

# Android: winit and android-activity with one fix each, until the fixes are released upstream.
# winit: a relaunched activity (navigation mode, font size, locale) no longer stays black.
# android-activity: no crash when the soft keyboard's text is read before it has any.
[patch.crates-io]
winit = { git = "https://github.com/DrawnUi/winit", rev = "fd3685990f74fb3e8917ee56f3a33690b9471d16" }
android-activity = { git = "https://github.com/DrawnUi/android-activity", rev = "d45520c015edc340c16770c2266d711327ce01f1" }
