// The APK: libdrawnnetc.so (the DrawnUI app, built by ../android.ps1 with cargo-ndk) under
// MainActivity (a GameActivity), the VPN service in Java, and Xray-core from libv2ray.aar
// (AndroidLibXrayLite: Xray-core built with gomobile, its own TUN on the VpnService fd).
plugins {
    id 'com.android.application' version '8.5.2'
}

def root = file('..')
layout.buildDirectory = new File(root, 'target/android/gradle')

android {
    namespace 'com.appomobi.drawnnetc'
    compileSdk 36
    defaultConfig {
        applicationId 'com.appomobi.drawnnetc'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.1.3'
        // Only the ABIs this build is for (-Pabis=arm64-v8a,armeabi-v7a; android.ps1 passes it):
        // the AAR carries Go libraries for every ABI, about 33 MB each.
        ndk { abiFilters(*((project.findProperty('abis') ?: 'arm64-v8a').toString().split(','))) }
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        res.srcDirs = ['res']
        java.srcDirs = ['java']
        jniLibs.srcDirs = [new File(root, 'target/android/lib')]
        assets.srcDirs = [new File(root, 'target/android/stage')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // The release key: keystore.properties next to this file (not in git: storeFile, keyAlias) and
    // the password in the environment variable it names (storePasswordEnv). Without the file the
    // build is signed with the debug key, so anyone can build it.
    def keyFile = file('keystore.properties')
    signingConfigs {
        if (keyFile.exists()) {
            def key = new Properties()
            keyFile.withInputStream { key.load(it) }
            def password = System.getenv(key.getProperty('storePasswordEnv'))
            if (password == null) throw new GradleException("Set ${key.getProperty('storePasswordEnv')} to the keystore password")
            release {
                storeFile file(key.getProperty('storeFile'))
                keyAlias key.getProperty('keyAlias')
                storePassword password
                keyPassword password
            }
        }
    }
    buildTypes {
        release {
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
            // R8: shrinks and renames the Java code; proguard-rules.pro keeps what JNI calls by name.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation files('libs/libv2ray.aar')
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.0'
    // AppCompat pulls kotlin-stdlib 1.8 and the old jdk7 / jdk8 parts, which duplicate its classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
